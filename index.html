    <script>
      // The build pre-renders content, so the entrance animation must hide the
      // hero before first paint rather than after hydration. Running inline in
      // <head> keeps the reveal flicker-free, and with JavaScript disabled the
      // class is never added so the page stays fully visible.
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("motion-ready");
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            document.documentElement.classList.add("page-ready");
